name: MCP Toolbox
version: "0.2.0"
slug: mcp_toolbox
description: Serveur MCP générique (tools en plugins) pour Claude et les LLM de Home Assistant
url: https://github.com/silvinus/ha-mcp-toolbox
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: MCP (Streamable HTTP /mcp et SSE /sse)
map:
  - share:ro
watchdog: tcp://[HOST]:[PORT:8765]
options:
  token: ""
  trusted_networks:
    - 172.30.32.0/23
  log_level: info
  env:
    - ECBATAN_URL=https://planning.example.invalid
schema:
  token: password?
  trusted_networks:
    - str
  log_level: list(debug|info|warning|error)
  env:
    - str
